<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>جدول متابعة الطلاب</title>
<style>
/* ================= إعادة الضبط ================= */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }

:root {
  --primary: #2563eb;
  --primary-dark: #1e40af;
  --green: #16a34a;
  --red: #dc2626;
  --orange: #d97706;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
}

body { background: var(--bg); color: var(--text); min-height: 100vh; }

.container { max-width: 1100px; margin: 0 auto; padding: 20px; }

/* ================= 1) الهيدر ================= */
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 28px 20px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.header h1 { font-size: 28px; margin-bottom: 6px; }
.header p { opacity: .85; }

/* ================= 2) كروت الإحصائيات ================= */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin: 24px 0;
}
.stat-card {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  border-right: 4px solid var(--primary);
}
.stat-card .icon { font-size: 28px; }
.stat-card .num { font-size: 26px; font-weight: bold; margin: 6px 0; }
.stat-card .label { color: var(--muted); font-size: 14px; }
.stat-card.total   { border-color: var(--primary); }
.stat-card.present { border-color: var(--green); }
.stat-card.absent  { border-color: var(--red); }
.stat-card.avg     { border-color: var(--orange); }

/* ================= 3) شريط الأدوات ================= */
.toolbar {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  margin-bottom: 16px;
}
.toolbar input, .toolbar select {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}
.toolbar input:focus, .toolbar select:focus { border-color: var(--primary); }
.search { flex: 1; min-width: 200px; }

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  transition: .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-cancel { background: var(--border); color: var(--text); }

/* ================= 4) الجدول ================= */
.table-box {
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; min-width: 850px; }
th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--border); }
th { background: #f8fafc; color: var(--muted); font-size: 14px; }
tbody tr:hover { background: #f8fafc; }

/* شارات الحالة */
.badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
.badge.present { background: #dcfce7; color: var(--green); }
.badge.absent  { background: #fee2e2; color: var(--red); }
.badge.late    { background: #fef3c7; color: var(--orange); }

/* ألوان الدرجات */
.grade { font-weight: bold; }
.grade-high { color: var(--green); }    /* 85 فأكثر */
.grade-mid  { color: var(--primary); }  /* 65 - 84 */
.grade-low  { color: var(--orange); }   /* 50 - 64 */
.grade-fail { color: var(--red); }      /* أقل من 50 */

/* أزرار الإجراءات */
.actions-btns { display: flex; gap: 6px; }
.btn-sm { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn-edit   { background: #dbeafe; color: var(--primary); }
.btn-delete { background: #fee2e2; color: var(--red); }

/* رسالة لا توجد بيانات */
.empty { text-align: center; padding: 40px; color: var(--muted); }

/* ================= 5) النافذة المنبثقة ================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; }
.modal h2 { margin-bottom: 18px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

/* ================= 6) الفوتر ================= */
.footer { text-align: center; padding: 20px; color: var(--muted); font-size: 14px; margin-top: 30px; }

@media(max-width: 600px) {
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>

<!-- ================= 1) الهيدر ================= -->
<header class="header">
  <h1>📋 جدول متابعة الطلاب</h1>
  <p>تابع حضور ودرجات الطلاب بسهولة</p>
</header>

<div class="container">

  <!-- ================= 2) الإحصائيات ================= -->
  <section class="stats">
    <div class="stat-card total">
      <div class="icon">👨‍🎓</div>
      <div class="num" id="totalCount">0</div>
      <div class="label">إجمالي الطلاب</div>
    </div>
    <div class="stat-card present">
      <div class="icon">✅</div>
      <div class="num" id="presentCount">0</div>
      <div class="label">الحاضرون</div>
    </div>
    <div class="stat-card absent">
      <div class="icon">❌</div>
      <div class="num" id="absentCount">0</div>
      <div class="label">الغائبون</div>
    </div>
    <div class="stat-card avg">
      <div class="icon">📊</div>
      <div class="num" id="avgGrade">0%</div>
      <div class="label">متوسط الدرجات</div>
    </div>
  </section>

  <!-- ================= 3) شريط الأدوات ================= -->
  <div class="toolbar">
    <input type="text" class="search" id="searchInput" placeholder="🔍 ابحث باسم الطالب..." oninput="renderStudents()">
    <select id="filterClass" onchange="renderStudents()">
      <option value="">كل الصفوف</option>
      <option value="الصف الأول">الصف الأول</option>
      <option value="الصف الثاني">الصف الثاني</option>
      <option value="الصف الثالث">الصف الثالث</option>
    </select>
    <button class="btn btn-primary" onclick="openModal()">➕ إضافة طالب</button>
  </div>

  <!-- ================= 4) الجدول ================= -->
  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>اسم الطالب</th>
          <th>الصف</th>
          <th>رقم الهاتف</th>
          <th>الحالة</th>
          <th>الدرجة</th>
          <th>ملاحظات</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="studentsTable"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">لا يوجد طلاب 🙁</div>
  </div>

</div>

<!-- ================= 5) نافذة الإضافة / التعديل ================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">إضافة طالب جديد</h2>
    <input type="hidden" id="studentId">
    <div class="form-group">
      <label>اسم الطالب *</label>
      <input type="text" id="studentName" placeholder="اكتب اسم الطالب">
    </div>
    <div class="form-group">
      <label>الصف *</label>
      <select id="studentClass">
        <option value="الصف الأول">الصف الأول</option>
        <option value="الصف الثاني">الصف الثاني</option>
        <option value="الصف الثالث">الصف الثالث</option>
      </select>
    </div>
    <div class="form-group">
      <label>رقم الهاتف</label>
      <input type="tel" id="studentPhone" placeholder="01xxxxxxxxx">
    </div>
    <div class="form-group">
      <label>الحالة</label>
      <select id="studentStatus">
        <option value="حاضر">حاضر</option>
        <option value="غائب">غائب</option>
        <option value="متأخر">متأخر</option>
      </select>
    </div>
    <div class="form-group">
      <label>الدرجة (من 100)</label>
      <input type="number" id="studentGrade" min="0" max="100" value="0">
    </div>
    <div class="form-group">
      <label>ملاحظات</label>
      <textarea id="studentNotes" rows="2" placeholder="أي ملاحظات عن الطالب..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveStudent()">💾 حفظ</button>
      <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- ================= 6) الفوتر ================= -->
<footer class="footer">
  جميع الحقوق محفوظة © 2025 — نظام متابعة الطلاب
</footer>

<script>
/* ================= البيانات ================= */
let students = JSON.parse(localStorage.getItem('students')) || [
  { id: 1, name: 'أحمد محمد علي',   className: 'الصف الأول',  phone: '01012345678', status: 'حاضر',  grade: 92, notes: 'طالب متفوق' },
  { id: 2, name: 'سارة أحمد حسن',   className: 'الصف الثاني', phone: '01123456789', status: 'حاضر',  grade: 78, notes: '' },
  { id: 3, name: 'محمود خالد',      className: 'الصف الأول',  phone: '01234567890', status: 'غائب',  grade: 45, notes: 'يحتاج متابعة' },
  { id: 4, name: 'فاطمة إبراهيم',   className: 'الصف الثالث', phone: '01098765432', status: 'متأخر', grade: 88, notes: '' },
  { id: 5, name: 'يوسف عبد الله',   className: 'الصف الثاني', phone: '01555555555', status: 'حاضر',  grade: 65, notes: '' }
];

function saveToStorage() {
  localStorage.setItem('students', JSON.stringify(students));
}

/* ================= عرض الجدول ================= */
function renderStudents() {
  const search = document.getElementById('searchInput').value.trim();
  const filterClass = document.getElementById('filterClass').value;

  const filtered = students.filter(s => {
    const matchSearch = s.name.includes(search);
    const matchClass = filterClass === '' || s.className === filterClass;
    return matchSearch && matchClass;
  });

  const tbody = document.getElementById('studentsTable');
  tbody.innerHTML = '';

  filtered.forEach((s, i) => {
    const statusClass = s.status === 'حاضر' ? 'present' : s.status === 'غائب' ? 'absent' : 'late';
    const gradeClass = s.grade >= 85 ? 'grade-high' : s.grade >= 65 ? 'grade-mid' : s.grade >= 50 ? 'grade-low' : 'grade-fail';

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${s.name}</td>
      <td>${s.className}</td>
      <td>${s.phone || '—'}</td>
      <td><span class="badge ${statusClass}">${s.status}</span></td>
      <td><span class="grade ${gradeClass}">${s.grade}%</span></td>
      <td>${s.notes || '—'}</td>
      <td>
        <div class="actions-btns">
          <button class="btn-sm btn-edit" onclick="openModal(${s.id})">✏️ تعديل</button>
          <button class="btn-sm btn-delete" onclick="deleteStudent(${s.id})">🗑️ حذف</button>
        </div>
      </td>`;
    tbody.appendChild(row);
  });

  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  updateStats();
}

/* ================= الإحصائيات ================= */
function updateStats() {
  const total = students.length;
  const present = students.filter(s => s.status === 'حاضر').length;
  const absent = students.filter(s => s.status === 'غائب').length;
  const avg = total ? Math.round(students.reduce((sum, s) => sum + Number(s.grade), 0) / total) : 0;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('presentCount').textContent = present;
  document.getElementById('absentCount').textContent = absent;
  document.getElementById('avgGrade').textContent = avg + '%';
}

/* ================= النافذة المنبثقة ================= */
function openModal(id) {
  if (id) {
    // ✏️ وضع التعديل
    const s = students.find(x => x.id === id);
    document.getElementById('modalTitle').textContent = 'تعديل بيانات الطالب';
    document.getElementById('studentId').value = s.id;
    document.getElementById('studentName').value = s.name;
    document.getElementById('studentClass').value = s.className;
    document.getElementById('studentPhone').value = s.phone;
    document.getElementById('studentStatus').value = s.status;
    document.getElementById('studentGrade').value = s.grade;
    document.getElementById('studentNotes').value = s.notes;
  } else {
    // ➕ وضع الإضافة
    document.getElementById('modalTitle').textContent = 'إضافة طالب جديد';
    document.getElementById('studentId').value = '';
    document.getElementById('studentName').value = '';
    document.getElementById('studentClass').selectedIndex = 0;
    document.getElementById('studentPhone').value = '';
    document.getElementById('studentStatus').selectedIndex = 0;
    document.getElementById('studentGrade').value = 0;
    document.getElementById('studentNotes').value = '';
  }
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// إغلاق النافذة عند الضغط خارجها
document.getElementById('modalOverlay').addEventListener('click', function (e) {
  if (e.target === this) closeModal();
});

/* ================= حفظ (إضافة / تعديل) ================= */
function saveStudent() {
  const id = document.getElementById('studentId').value;
  const name = document.getElementById('studentName').value.trim();
  const className = document.getElementById('studentClass').value;
  const phone = document.getElementById('studentPhone').value.trim();
  const status = document.getElementById('studentStatus').value;
  const grade = Number(document.getElementById('studentGrade').value);
  const notes = document.getElementById('studentNotes').value.trim();

  if (!name) { alert('من فضلك اكتب اسم الطالب!'); return; }

  if (id) {
    // تعديل طالب موجود
    const s = students.find(x => x.id === Number(id));
    s.name = name; s.className = className; s.phone = phone;
    s.status = status; s.grade = grade; s.notes = notes;
  } else {
    // إضافة طالب جديد
    const newId = students.length ? Math.max(...students.map(s => s.id)) + 1 : 1;
    students.push({ id: newId, name, className, phone, status, grade, notes });
  }

  saveToStorage();
  renderStudents();
  closeModal();
}

/* ================= حذف ================= */
function deleteStudent(id) {
  if (confirm('هل أنت متأكد من حذف هذا الطالب؟')) {
    students = students.filter(s => s.id !== id);
    saveToStorage();
    renderStudents();
  }
}

/* ================= بدء التشغيل ================= */
renderStudents();
</script>

</body>
  </html>
